<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A84FF"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="96" y="112" font-family="-apple-system,'PingFang SC',sans-serif" font-size="44" font-weight="700" fill="#1D1D1F">应用场景 · 三个身边的真实问题</text>
  <text x="96" y="158" font-family="-apple-system,'PingFang SC',sans-serif" font-size="24" fill="#6E6E73">云端 AI 助手解决不了的场景，恰好是本地引擎的主场</text>

  <g font-family="-apple-system,'PingFang SC',sans-serif">
    <!-- 场景卡 1：网络受限（lucide wifi-off） -->
    <g transform="translate(96,230)">
      <rect width="400" height="380" rx="20" fill="#F7F7FA" stroke="#D9D9DE"/>
      <g transform="translate(108,78) scale(2.6)" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"/>
        <path d="M8.5 16.429a5 5 0 0 1 7 0"/>
        <path d="M5 12.859a10 10 0 0 1 5.17-2.69"/>
        <path d="M19 12.859a10 10 0 0 0-2.007-1.523"/>
        <path d="M2 8.82a15 15 0 0 1 4.177-2.643"/>
        <path d="M22 8.82a15 15 0 0 0-11.288-3.764"/>
        <path d="m2 2 20 20" stroke="#FF3B30"/>
      </g>
      <text x="60" y="216" font-size="28" font-weight="700" fill="#1D1D1F">学校网络受限</text>
      <text x="60" y="262" font-size="19" fill="#6E6E73">教室和宿舍的网络时好时坏，</text>
      <text x="60" y="292" font-size="19" fill="#6E6E73">云端 AI 助手经常打不开。</text>
      <text x="60" y="336" font-size="17" fill="#AEAEB2">问题：断网 = 功能归零</text>
    </g>
    <line x1="512" y1="420" x2="660" y2="420" stroke="#0A84FF" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 场景卡 2：出国旅行（lucide send 纸飞机） -->
    <g transform="translate(676,230)">
      <rect width="400" height="380" rx="20" fill="#F7F7FA" stroke="#D9D9DE"/>
      <g transform="translate(118,70) scale(2.6) rotate(-6)" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/>
        <path d="m21.854 2.147-10.94 10.939"/>
      </g>
      <text x="60" y="216" font-size="28" font-weight="700" fill="#1D1D1F">出国旅行</text>
      <text x="60" y="262" font-size="19" fill="#6E6E73">漫游流量又贵又不稳，</text>
      <text x="60" y="292" font-size="19" fill="#6E6E73">AI 助手时灵时不灵。</text>
      <text x="60" y="336" font-size="17" fill="#AEAEB2">问题：网络成本高、可用性差</text>
    </g>
    <line x1="1092" y1="420" x2="1240" y2="420" stroke="#0A84FF" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 场景卡 3：隐私敏感（lucide lock） -->
    <g transform="translate(1256,230)">
      <rect width="400" height="380" rx="20" fill="#F7F7FA" stroke="#D9D9DE"/>
      <g transform="translate(118,72) scale(2.6)" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </g>
      <text x="60" y="216" font-size="28" font-weight="700" fill="#1D1D1F">隐私敏感</text>
      <text x="60" y="262" font-size="19" fill="#6E6E73">日程、健康记录、私人对话，</text>
      <text x="60" y="292" font-size="19" fill="#6E6E73">不想上传到云端服务器。</text>
      <text x="60" y="336" font-size="17" fill="#AEAEB2">问题：数据出境 = 隐私风险</text>
    </g>

    <!-- 解决方案卡 -->
    <g transform="translate(96,650)">
      <rect width="1560" height="120" rx="20" fill="#EAF3FF" stroke="#0A84FF" stroke-width="2"/>
      <circle cx="76" cy="60" r="26" fill="#0A84FF"/>
      <path d="M66,60 L76,72 L92,50" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="130" y="52" font-size="26" font-weight="700" fill="#0A84FF">一个方案全解决：本地推理引擎</text>
      <text x="130" y="92" font-size="20" fill="#1D1D1F">断网可用 · 数据不出设备 · 模型装进手机（1.7B 量化档按内存选择）</text>
    </g>
  </g>

  <line x1="96" y1="816" x2="1504" y2="816" stroke="#D9D9DE"/>
  <text x="96" y="854" font-family="-apple-system,'PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#1D1D1F">结论：三个痛点指向同一个答案——把 AI 从云端搬进手机。</text>
  <text x="96" y="884" font-family="-apple-system,'PingFang SC',sans-serif" font-size="16" fill="#AEAEB2">来源：选题论证（docs/aiy27/方案B-LLM推理引擎.md §一） · 数据不出设备为 PIPL 产品纪律 · 图标：lucide（ISC）</text>
</svg>

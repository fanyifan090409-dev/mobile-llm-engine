        <circle cx="42" cy="42" r="17" fill="#0A84FF"/>
        <text x="42" y="49" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
        <text x="32" y="96" font-size="20" font-weight="600" fill="#1D1D1F">评测 90-97.5%</text>

  <line x1="96" y1="816" x2="1504" y2="816" stroke="#D9D9DE"/>
  <text x="96" y="854" font-family="-apple-system,'PingFang SC',sans-serif" font-size="22" font-weight="600" fill="#1D1D1F">结论：0.6B 负责「证明能跑通」，1.7B 负责「把能力做满」——两条线共用同一套训练与评测基础设施。</text>
  <text x="96" y="884" font-family="-apple-system,'PingFang SC',sans-serif" font-size="16" fill="#AEAEB2">来源：0.6B SFT3B 工具调用 40/40（2026-10-26 实测）· SFT17 评测报告（2026-11-02）· 训练机 checkpoint 日志 · 口径说明：同一套 40 题评测协议，0.6B 为单档结构验证，1.7B 为三档量化矩阵</text>

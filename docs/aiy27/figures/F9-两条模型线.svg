  <text x="96" y="158" font-family="-apple-system,'PingFang SC',sans-serif" font-size="24" fill="#6E6E73">同一条「续训 → SFT → 量化 → 评测」流水线——0.6B 证明路通，1.7B 承接全部能力</text>


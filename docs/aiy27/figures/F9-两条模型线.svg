        <text x="32" y="96" font-size="20" font-weight="600" fill="#1D1D1F">SFT</text>
        <text x="32" y="128" font-size="15" fill="#6E6E73">工具调用格式监督微调</text>
      </g>
      <line x1="864" y1="336" x2="888" y2="336" stroke="#AEAEB2" stroke-width="2" marker-end="url(#arrow)"/>
